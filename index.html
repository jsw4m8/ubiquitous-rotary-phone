<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paycheck to Paycheck</title>
<style>
  :root{
    --bg: #14181c;
    --surface: #1f252b;
    --surface-raised: #262d34;
    --line: #3a434b;
    --text: #e9e6df;
    --text-dim: #a3aab1;
    --money: #5fa8a0;
    --money-dim: #3d6e69;
    --energy: #c9a24b;
    --energy-dim: #86702f;
    --gpa: #7b93c9;
    --gpa-dim: #4c5c82;
    --danger: #b8563d;
    --danger-bright: #d97452;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body{
    display:flex;
    justify-content:center;
    padding: 32px 16px 64px;
  }

  #app{ width: 100%; max-width: 640px; }

  /* ---------- Meters ---------- */
  .meters{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .meter{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
  }
  .meter-label{
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .meter-value{
    font-family: var(--mono);
    font-size: 18px;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .meter-value.money{ color: var(--money); }
  .meter-value.energy{ color: var(--energy); }
  .meter-value.gpa{ color: var(--gpa); }
  .meter-track{
    height: 5px;
    background: var(--line);
    border-radius: 3px;
    overflow:hidden;
  }
  .meter-fill{ height:100%; transition: width 0.4s ease; }
  .meter-fill.money{ background: var(--money); }
  .meter-fill.energy{ background: var(--energy); }
  .meter-fill.gpa{ background: var(--gpa); }
  .meter-fill.low{ background: var(--danger-bright); }

  .day-tracker{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
    margin: -18px 0 18px;
  }

  /* ---------- Cards ---------- */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px 26px;
  }

  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  h1{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 30px;
    line-height: 1.2;
    margin: 0 0 14px;
  }
  h2{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 14px;
  }

  p{
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    margin: 0 0 16px;
    max-width: 62ch;
  }
  p.dim{ color: var(--text-dim); }

  .intro-copy p{ font-size: 16px; }

  button{
    font-family: var(--sans);
    cursor:pointer;
  }

  .primary-btn{
    background: var(--money);
    color: #0f1a19;
    border: none;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border-radius: 3px;
  }
  .primary-btn:hover{ background: #74bcb3; }

  .ghost-btn{
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 3px;
    margin-top: 8px;
  }
  .ghost-btn:hover{ border-color: var(--text-dim); color: var(--text); }

  /* ---------- Choices ---------- */
  .choice-list{ display:flex; flex-direction:column; gap:10px; margin-top: 20px; }

  .choice{
    text-align:left;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    color: var(--text);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .choice:hover{ border-color: var(--money-dim); background:#2b333b; }
  .choice-title{ font-size: 15px; font-weight: 600; }
  .choice-effects{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-dim);
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .effect.money{ color: var(--money); }
  .effect.energy{ color: var(--energy); }
  .effect.gpa{ color: var(--gpa); }
  .effect.negative{ color: var(--danger-bright); }

  /* ---------- Weekly allocation ---------- */
  .allocation{ margin-top: 18px; display:flex; flex-direction:column; gap:20px; }
  .alloc-row{ display:flex; flex-direction:column; gap:6px; }
  .alloc-row-head{
    display:flex; justify-content:space-between;
    font-size: 14px;
  }
  .alloc-row-head .val{ font-family: var(--mono); color: var(--text-dim); }
  input[type="range"]{
    width:100%;
    accent-color: var(--money);
  }
  .alloc-total{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    text-align:right;
  }
  .alloc-total.over{ color: var(--danger-bright); }

  /* ---------- Toast / feedback ---------- */
  .feedback{
    margin-top: 18px;
    padding: 12px 14px;
    border-left: 3px solid var(--money);
    background: #1a2422;
    font-size: 14px;
    color: var(--text-dim);
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.bad{ border-left-color: var(--danger-bright); background: #241a17; }

  /* ---------- End screen ---------- */
  .end-stat-row{
    display:flex; justify-content:space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 14px;
  }
  .end-stat-row:last-child{ border-bottom:none; }

  footer{
    max-width: 640px;
    margin: 20px auto 0;
    text-align:center;
    font-size: 12px;
    color: var(--text-dim);
  }

  @media (max-width: 480px){
    .card{ padding: 22px 18px; }
    h1{ font-size: 24px; }
    .meters{ gap: 8px; }
  }
</style>
</head>

/* =========================================================================
   RENDER HELPERS
   ========================================================================= */
const $ = (sel) => document.querySelector(sel);
const card = () => $("#card");

function fmtMoney(n){
  const sign = n < 0 ? "-$" : "$";
  return sign + Math.abs(Math.round(n)).toLocaleString();
}

function updateMeters(){
  $("#meters").style.display = "grid";
  $("#day-tracker").style.display = "block";

  $("#val-money").textContent = fmtMoney(state.money);
  $("#val-gpa").textContent = state.gpa.toFixed(2);
  $("#val-energy").textContent = Math.round(state.energy);

  const moneyPct = Math.max(0, Math.min(100, (state.money / (CONFIG.startingMoney * 1.5)) * 100));
  const gpaPct = Math.max(0, Math.min(100, (state.gpa / 4.0) * 100));
  const energyPct = Math.max(0, Math.min(100, state.energy));

  setFill("fill-money", moneyPct, state.money < 50);
  setFill("fill-gpa", gpaPct, state.gpa < CONFIG.gpaFailThreshold + 0.3);
  setFill("fill-energy", energyPct, state.energy < 25);

  $("#day-tracker").textContent = `Day ${state.day} of ${CONFIG.totalDays}`;
}

function setFill(id, pct, isLow){
  const el = $("#" + id);
  el.style.width = pct + "%";
  el.classList.toggle("low", !!isLow);
}

function applyEffects(effects){
  state.money += effects.money || 0;
  state.gpa = Math.max(0, Math.min(4.0, state.gpa + (effects.gpa || 0)));
  state.energy = Math.max(0, Math.min(100, state.energy + (effects.energy || 0)));
}

function effectSpan(value, unit){
  if(!value) return "";
  const cls = value < 0 ? "negative" : "";
  const sign = value > 0 ? "+" : "";
  let display;
  if(unit === "money") display = sign + fmtMoney(value).replace("-$","-$").replace("$","$");
  else if(unit === "gpa") display = sign + value.toFixed(2) + " GPA";
  else display = sign + value + " energy";
  return `<span class="effect ${unit} ${cls}">${display}</span>`;
}

/* =========================================================================
   SCREENS
   ========================================================================= */
function screenIntro(){
  card().innerHTML = `
    <div class="eyebrow">A game about making rent</div>
    <h1>Paycheck to Paycheck</h1>
    <div class="intro-copy">
      <p>You're a college student. You pay your own rent, your own gas, your own
      groceries. Financial aid covers some of school — none of the rest.</p>
      <p>Every choice this semester costs something: money, energy, or your GPA.
      Rarely just one. Try to make it to finals without running out of any of them.</p>
    </div>
    <button class="primary-btn" id="start-btn">Begin the semester</button>
  `;
  $("#start-btn").addEventListener("click", () => {
    resetState();
    screenHousing();
  });
}

function screenHousing(){
  const optionsHtml = CONFIG.housing.map(h => `
    <button class="choice" data-id="${h.id}">
      <span class="choice-title">${h.title}</span>
      <span class="choice-effects">
        <span class="effect money">${fmtMoney(-h.rent)}/mo rent</span>
        ${h.commuteGas ? `<span class="effect negative">~${fmtMoney(-h.commuteGas)} gas/mo</span>` : ""}
      </span>
      <span style="font-size:13px; color:var(--text-dim);">${h.desc}</span>
    </button>
  `).join("");

  card().innerHTML = `
    <div class="eyebrow">Before day one</div>
    <h2>Where are you going to live?</h2>
    <p class="dim">This decision shapes your rent, your commute, and your gas costs
    for the rest of the semester.</p>
    <div class="choice-list">${optionsHtml}</div>
  `;

  card().querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => {
      state.housing = CONFIG.housing.find(h => h.id === btn.dataset.id);
      state.day = 1;
      updateMeters();
      nextTurn();
    });
  });
}

let deck = [];
let deckIndex = 0;

function nextTurn(){
  // periodic rent + paycheck + housing commute cost, applied every few turns
  if(state.day > 1 && (state.day - 1) % CONFIG.paycheckEveryNDays === 0){
    state.money += CONFIG.paycheckAmount;
  }
  if(state.day > 1 && (state.day - 1) % 7 === 0){
    state.money -= state.housing.rent;
    state.money -= state.housing.commuteGas;
    state.energy = Math.max(0, state.energy - state.housing.commuteEnergy);
  }

  updateMeters();
  checkFailStates();
  if(state.ended) return;

  if(deckIndex >= deck.length){
    screenEnd("survived");
    return;
  }

  screenScenario(deck[deckIndex]);
}

function checkFailStates(){
  if(state.money < CONFIG.moneyFailThreshold){
    screenEnd("broke");
  } else if(state.gpa < CONFIG.gpaFailThreshold){
    screenEnd("probation");
  } else if(state.energy <= CONFIG.energyCrashThreshold){
    screenEnd("burnout");
  }
}

function screenScenario(scenario){
  const choicesHtml = scenario.choices.map((c, i) => `
    <button class="choice" data-index="${i}">
      <span class="choice-title">${c.label}</span>
      <span class="choice-effects">
        ${effectSpan(c.effects.money, "money")}
        ${effectSpan(c.effects.gpa, "gpa")}
        ${effectSpan(c.effects.energy, "energy")}
      </span>
    </button>
  `).join("");

  card().innerHTML = `
    <div class="eyebrow">${scenario.eyebrow}</div>
    <h2>${scenario.title}</h2>
    <p>${scenario.body}</p>
    <div class="choice-list">${choicesHtml}</div>
    <div class="feedback" id="feedback"></div>
  `;

  card().querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => {
      const choice = scenario.choices[parseInt(btn.dataset.index, 10)];
      applyEffects(choice.effects);
      updateMeters();

      card().querySelectorAll(".choice").forEach(b => b.disabled = true);
      const fb = $("#feedback");
      fb.textContent = choice.result;
      fb.classList.add("show");
      if((choice.effects.money||0) < 0 && (choice.effects.gpa||0) <= 0 && (choice.effects.energy||0) < 0){
        fb.classList.add("bad");
      }

      const cont = document.createElement("button");
      cont.className = "ghost-btn";
      cont.textContent = "Continue";
      cont.style.marginTop = "16px";
      cont.addEventListener("click", () => {
        state.day += 1;
        deckIndex += 1;
        nextTurn();
      });
      card().appendChild(cont);
    });
  });
}

function screenEnd(kind){
  state.ended = true;
  const endings = {
    survived: {
      eyebrow: "End of semester",
      title: "You made it to finals.",
      body: "It wasn't comfortable, and it wasn't guaranteed. Most students juggling work, school, and rent are one bad week away from a different outcome."
    },
    broke: {
      eyebrow: "End of semester",
      title: "You ran out of money.",
      body: "Rent, gas, food — it adds up faster than a part-time paycheck can keep pace with. This is the reality for a lot of students living paycheck to paycheck."
    },
    probation: {
      eyebrow: "End of semester",
      title: "Your GPA dropped too far.",
      body: "Working to survive left too little room for classwork. Financial stress doesn't just affect a bank account — it affects grades, focus, and health."
    },
    burnout: {
      eyebrow: "End of semester",
      title: "You burned out.",
      body: "There are only so many hours to split between work, school, sleep, and everything else. Something had to give."
    }
  };
  const e = endings[kind];

  card().innerHTML = `
    <div class="eyebrow">${e.eyebrow}</div>
    <h2>${e.title}</h2>
    <p>${e.body}</p>
    <div style="margin: 20px 0;">
      <div class="end-stat-row"><span>Days completed</span><span>${state.day} / ${CONFIG.totalDays}</span></div>
      <div class="end-stat-row"><span>Final balance</span><span>${fmtMoney(state.money)}</span></div>
      <div class="end-stat-row"><span>Final GPA</span><span>${state.gpa.toFixed(2)}</span></div>
      <div class="end-stat-row"><span>Final energy</span><span>${Math.round(state.energy)}</span></div>
    </div>
    <button class="primary-btn" id="restart-btn">Play again</button>
  `;

  $("#restart-btn").addEventListener("click", () => {
    deckIndex = 0;
    deck = buildDeck();
    screenIntro();
  });
}

/* =========================================================================
   INIT
   ========================================================================= */
deck = buildDeck();
screenIntro();
</script>
</body>
</html>
